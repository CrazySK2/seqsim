// 주회로: drawMain과 같은 좌표
function wrMainGeo(){const a=66,b=a+170,L=[a,a+28,a+56],PE=a+90,L2=[b,b+28,b+56],PE2=b+90,T0=Y0-24,xV=MAINW-22,xL=lineX(0),yB=bY(circ.cols);
  const yM=T0+56,y1=T0+92,y2=T0+110,fx=MAINW-74,yE0=T0+124,yE1=T0+148,yC=T0+238,yT=T0+290,brY=[T0+204,T0+190,T0+176],g={};
  const S=(id,segs,pts)=>{g[id]={segs,pts}};
  ["L1","L2","L3"].forEach((n,i)=>{const x=L[i];
    S("in"+n,[[x,T0,x,yM-12]],[[x,T0],[x,yM-12]]);
    const o=[[x,yM+12,x,yE0]],op=[[x,yM+12],[x,yE0]];if(i!==1){const yy=i?y2:y1;o.push([x,yy,fx,yy]);op.push([fx,yy])}S("o"+n,o,op);
    S("e"+n,[[x,yE1,x,yC-12],[x,brY[i],L2[i],brY[i]],[L2[i],brY[i],L2[i],yC-12]],[[x,yE1],[x,yC-12],[L2[i],yC-12]]);
    S("m1"+n,[[x,yC+12,x,yT]],[[x,yC+12],[x,yT]]);S("m2"+n,[[L2[i],yC+12,L2[i],yT]],[[L2[i],yC+12],[L2[i],yT]])});
  S("PE",[[PE,T0,PE,yT],[PE,T0+162,PE2,T0+162],[PE2,T0+162,PE2,yT]],[[PE,T0],[PE,yT],[PE2,yT]]);
  S("R",[[fx+28,y1,xV,y1],[xV,y1,xV,Y0],[xV,Y0,xL,Y0]],[[fx+28,y1]]);
  S("T",[[fx+28,y2,xV,y2],[xV,y2,xV,yB],[xV,yB,xL,yB]],[[fx+28,y2]]);
  return g}
// 제어회로: 같은 전위로 묶인 선분(모선·세로선·가로선)
function wrSeqNetGeo(C,find){const g=new Map(),xL=lineX(0),yB=bY(C.cols),xR=lineX(C.rows-1);
  const add=(node,sg)=>{const r=find(node);if(!g.has(r))g.set(r,[]);g.get(r).push(sg)};
  for(let s=0;s<C.rows-1;s++)if(!C.bus.get(s))add(K(s,0),[lineX(s),Y0,lineX(s+1),Y0]);
  add("R",[xL,yB,xR,yB]);
  for(const[k,v]of C.cells)if(v.k==="WIRE"){const[r,c]=P(k);add(k,[lineX(r),bY(c),lineX(r),bY(c+1)])}
  for(const k of C.vlinks){if(C.hparts.has(k))continue;const[r,c]=P(k);add(k,[lineX(r),bY(c),lineX(r+1),bY(c)])}
  return g}
function wrNodeXY(n,C){if(n==="L")return[lineX(0),Y0];if(n==="R")return[lineX(0),bY(C.cols)];
  if(n.startsWith("FLS|")){const[,t,e]=n.split("|"),i=+e.slice(1)-1;for(const[k,v]of C.cells)if(v.k==="FLS"&&v.tag===t){const[l]=P(k);return[lineX(l)+[17,29,41][i],bY(C.cols)+44]}return null}
  const[l,b]=P(n);return[lineX(l),bY(b)]}

// ── 결선 모델: 제어판 점·전선 묶음·외부 기구 TB 배정 ──
const WR_EXT=new Set(["pb","ss","lamp","bz","ls","elec"]);
function wrBuild(){const C=circ,M=pnModel(C),st=lyState(),Pp=st.P,issues=[...M.issues];
  const by=id=>Pp.inner.find(d=>d.id===id),geo=new Map();
  for(const[ids,cy,rw]of[[st.inner.r1,145,1],[st.inner.r2,275,2]]){const ds=ids.map(by).filter(Boolean),{xs}=lyRowX(ds);ds.forEach((d,i)=>{const[w,h]=lySize(d);geo.set(d.id,{d,x:xs[i],y:cy-h/2,w,h,row:rw})})}
  // 배선 통로: 수평은 상하 기구(단자대 포함) 사이 한가운데 3곳, 수직은 제어판 양끝(바깥 기구와 제어판 벽 한가운데) 2곳.
  // 좌우로 이웃한 기구 사이로는 지나가지 않는다 → 통로를 바꿀 때는 반드시 양끝 수직 통로를 거친다.
  const band=r=>{const ds=[...geo.values()].filter(g=>g.row===r),cy=r===1?145:275;
    return ds.length?[Math.min(...ds.map(g=>g.y)),Math.max(...ds.map(g=>g.y+g.h))]:[cy-30,cy+30]};
  const chMid=(p,q)=>[(p+q)/2,Math.max(1.5,(q-p)/2-3.5)];
  const bd1=band(1),bd2=band(2),y5=50+LY_TB.h/2,y6=370-LY_TB.h/2;
  const[c1,a1]=chMid(y5,bd1[0]),[c2,a2]=chMid(bd1[1],bd2[0]),[c3,a3]=chMid(bd2[1],y6);
  const gxs=[...geo.values()],mnL=Math.min(200-LY_TB.bw,...gxs.map(g=>g.x)),mxR=Math.max(200+LY_TB.bw,...gxs.map(g=>g.x+g.w));
  const[xL,aL]=chMid(0,mnL),[xR,aR]=chMid(mxR,400);
  const ch={c:[c1,c2,c3],a:[a1,a2,a3],xL,xR,aL,aR};
  const pts=new Map();
  const screw=(g,ri,i)=>{const n=LY_PINS[g.d.kind][0].length,cw=g.w/n,ch2=Math.min(10,g.h*.17);
    return{x:g.x+cw*(i+.5),y:ri?g.y+g.h-ch2/2:g.y+ch2/2,up:!ri,ci:g.row===1?(ri?1:0):(ri?2:1)}};
  const lyIdOf=d=>d.type==="eocr"?"EOCR":d.type==="mc"?"mc:"+d.tag:["relay","timer","fr","fls","cnt"].includes(d.type)?"p8:"+d.tag:null;
  for(const d of M.devs){const lid=lyIdOf(d);if(!lid)continue;const g=geo.get(lid),t=PN_TPL[d.type];
    if(!g){if(d.pins.size)issues.push(`${d.tag}(${t.ko})는 제어판 배치에 없어 결선할 수 없습니다. 시퀀스도에 그 코일이 있는지 확인하세요.`);continue}
    for(const s of Object.keys(t.slots)){const num=t.slots[s];let ri=-1,i=-1;LY_PINS[g.d.kind].forEach((row,r)=>{const j=row.indexOf(num);if(j>=0){ri=r;i=j}});if(ri<0)continue;
      pts.set(d.id+"#"+s,{...screw(g,ri,i),kind:"dev",dev:d.id,name:d.tag+"-"+pnLabel(d.type,s),info:t.sk[s]||""})}}
  const gm=geo.get("MCCB"),gf=geo.get("F");
  if(gm)["L1","L2","L3"].forEach((n,i)=>{pts.set("MCCB#"+n+"t",{...screw(gm,0,i),kind:"dev",dev:"MCCB",name:`MCCB-${n}(1차)`,info:"전원 측"});pts.set("MCCB#"+n+"b",{...screw(gm,1,i),kind:"dev",dev:"MCCB",name:`MCCB-${n}(2차)`,info:"부하 측"})});
  if(gf)["L1","L3"].forEach((n,i)=>{pts.set("F#"+n+"t",{...screw(gf,0,i),kind:"dev",dev:"F",name:`F-${n}(1차)`,info:"퓨즈 1차 (주회로 쪽)"});pts.set("F#"+n+"b",{...screw(gf,1,i),kind:"dev",dev:"F",name:`F-${n}(2차)`,info:"퓨즈 2차 (조작회로 쪽)"})});
  const tbY={TB5:50+LY_TB.h*.16,TB6:370-LY_TB.h*.16};
  for(const tb of["TB5","TB6"])for(let n=1;n<=20;n++){const b=n>10?1:0,i=(n-1)%10;
    pts.set(tb+"#"+n,{x:200-LY_TB.bw+b*LY_TB.bw+LY_TB.bw/10*(i+.5),y:tbY[tb],up:tb==="TB6",ci:tb==="TB5"?0:2,kind:"tb",tb,n,dev:tb,name:tb+"-"+n,info:"단자대"})}
  // 전선 묶음: 주회로 + 제어회로
  const nets=[],has=id=>M.devMap.has(id),tag1=has("mc:MC1")?"MC1":has("mc:MC")?"MC":null,tag2=has("mc:MC2")?"MC2":null;
  const eid=[...M.devMap.keys()].find(k=>k.startsWith("eocr:"))||null,eok=eid&&Pp.eocr,PH3=["L1","L2","L3"],UVW=["U","V","W"];
  PH3.forEach(n=>nets.push({id:"in"+n,where:`주회로 ${n} (TB1 전원 → MCCB 1차)`,col:n,pins:["TB1#"+n,"MCCB#"+n+"t"],geo:["in"+n]}));
  PH3.forEach((n,i)=>{const o=["MCCB#"+n+"b",...(n!=="L2"?["F#"+n+"t"]:[])],mcs=[tag1,tag2].filter(Boolean),e=mcs.map(t=>`mc:${t}#${n}`);
    if(eok){nets.push({id:"o"+n,where:`주회로 ${n} (MCCB 2차 → ${n!=="L2"?"퓨즈 1차·":""}EOCR)`,col:n,pins:[...o,`${eid}#${n}`],geo:["o"+n]});
      nets.push({id:"e"+n,where:`주회로 ${UVW[i]} (EOCR → ${mcs.join("·")||"MC"})`,col:n,pins:[`${eid}#${UVW[i]}`,...e],geo:["e"+n]})}
    else nets.push({id:"o"+n,where:`주회로 ${n} (MCCB 2차 → ${n!=="L2"?"퓨즈 1차·":""}${mcs.join("·")||"MC"})`,col:n,pins:[...o,...e],geo:["o"+n,"e"+n]})});
  [[tag1,"m1","TB2","1"],[tag2,"m2","TB3","2"]].forEach(([t,g,tb,k])=>{if(t)PH3.forEach((n,i)=>nets.push({id:g+n,where:`주회로 ${UVW[i]}${k} (${t} → ${tb} 전동기)`,col:n,pins:[`mc:${t}#${UVW[i]}`,tb+"#"+UVW[i]],geo:[g+n]}))});
  nets.push({id:"PE",where:`접지 PE (TB1 → ${["TB2",tag2&&"TB3"].filter(Boolean).join("·")})`,col:"PE",pins:["TB1#PE","TB2#PE",...(tag2?["TB3#PE"]:[])],geo:["PE"]});
  const find=wireFind(C),sgeo=wrSeqNetGeo(C,find),mg=MAIN_ON?wrMainGeo():{};
  for(const n of M.nets){const isR=n.pins.includes("pwr:전원#r"),isT=n.pins.includes("pwr:전원#t");
    nets.push({id:"c"+n.no,where:isR?"R 모선 (퓨즈 2차 L1 → 조작회로)":isT?"T 모선 (퓨즈 2차 L3 → 조작회로 공통)":n.where,col:"C",
      pins:n.pins.map(p=>p==="pwr:전원#r"?"F#L1b":p==="pwr:전원#t"?"F#L3b":p),ctl:n,geo:isR?["R"]:isT?["T"]:[]})}
  for(const n of nets){const segs=[],sp=[];for(const g of n.geo){const q=mg[g];if(q){segs.push(...q.segs);sp.push(...q.pts)}}
    if(n.ctl){segs.push(...(sgeo.get(n.ctl.id)||[]));for(const nd of n.ctl.nodes){const q=wrNodeXY(nd,C);if(q)sp.push(q)}}
    n.sq={segs,pts:sp}}
  // 외부 기구 → (묶음, 위치)마다 TB 단자 하나
  const boxOf=new Map();for(const[b,items]of Object.entries(st.box.boxes))if(items)items.forEach((t,i)=>{if(t!=="CAP")boxOf.set(t,[b,i])});
  const locOf=pid=>{if(/^TB[123]#/.test(pid))return pid.slice(0,3);const dv=M.devMap.get(pid.split("#")[0]);if(!dv)return"?";
    if(dv.type==="ls"||dv.type==="elec")return"TB4";const b=boxOf.get(dv.tag);return b?b[0]:"박스 밖"};
  const extLabel=pid=>{const[d,s]=pid.split("#");if(/^TB[123]$/.test(d))return d+"-"+s;const dv=M.devMap.get(d);return dv.type==="elec"?s:dv.tag+"-"+pnLabel(dv.type,s)};
  const rk=pid=>{const[d,s]=pid.split("#");if(/^TB[123]$/.test(d))return{TB1:0,TB2:100,TB3:200}[d]+["L1","L2","L3","U","V","W","PE"].indexOf(s);
    const dv=M.devMap.get(d),T=PN_TPL[dv.type],sr=[...T.top,...T.bot].indexOf(s);
    if(dv.type==="elec")return 380+sr;if(dv.type==="ls")return 300+(Pp.ls.indexOf(dv.tag)+1)*6+sr;
    const b=boxOf.get(dv.tag);return b?1000+["B1","B2","B3","B4"].indexOf(b[0])*100+b[1]*10+sr:2000+sr};
  const LOCN={TB1:"TB1 전원",TB2:"TB2 전동기 M1",TB3:"TB3 전동기 M2",TB4:"TB4 (LS·전극)"};
  const units=[],outside=[];
  for(const n of nets){const inner=[],ext=new Map();
    for(const p of n.pins){const q=pts.get(p);if(q&&q.kind==="dev"){inner.push(p);continue}
      const dv=M.devMap.get(p.split("#")[0]);if(/^TB[123]#/.test(p)||(dv&&WR_EXT.has(dv.type))){const L=locOf(p);if(!ext.has(L))ext.set(L,[]);ext.get(L).push(p)}}
    n.inner=inner;n.units=[];
    if(!inner.length&&ext.size<=1){if(ext.size){const[L,ps]=[...ext][0];outside.push({net:n,loc:L,locName:LOCN[L]||"컨트롤 박스 "+L,label:ps.map(extLabel).join(", ")})}continue}
    for(const[L,ps]of ext){ps.sort((a,b)=>rk(a)-rk(b));const u={key:ps.slice().sort().join(","),loc:L,locName:LOCN[L]||(L==="박스 밖"?L:"컨트롤 박스 "+L),pins:ps,net:n,rank:rk(ps[0]),label:ps.map(extLabel).join(",")};n.units.push(u);units.push(u)}}
  const slots={TB5:[],TB6:[]};
  for(const u of units){const a=WR.assign[u.key];if(!a)continue;const[tb,ns]=String(a).split("#"),k=+ns;if(slots[tb]&&k>=1&&k<=20&&!slots[tb][k]){slots[tb][k]=u;u.tb=tb;u.n=k}}
  const free=tb=>{for(let i=1;i<=20;i++)if(!slots[tb][i])return i;return 0};
  // 자동 배정 (사용자 규칙, 2026-11-12) — 배관도의 배관 순서대로:
  //  · 배관은 언제나 도면에서 왼쪽 → 오른쪽. 한 배관 안에서도 J와 상관없이 왼쪽 상자(기구)가 먼저.
  //  · 상자 안에서는 공통선(그 상자 기구 둘 이상이 함께 쓰는 선) 먼저, 그다음 위에 있는 기구부터.
  //  · TB5(위): 1번째 배관 1번부터 · 2번째 배관(케이블, TB1 전원) L1·L2·L3·PE = 9·10·11·12 고정 · 3번째 배관 15번부터.
  //  · TB6(아래): 왼쪽부터 1번째 배관 1번, 2번째 7번, 3번째 11번, 4번째 17번부터.
  const sg=LY.jside==="left"?-1:1,BX={B1:-500,B2:450,B3:750,B4:-500};
  const topP=[{x:-100,locs:["B1"]},{x:0,locs:["TB1"]},{x:100,locs:["B2","B3"]}].sort((a,b)=>sg*a.x-sg*b.x);
  const botP=lyInd()   // 산업기사: 아래쪽은 뒤집지 않음 — ④ 금속관 TB2 · TB4 · TB3 · 오른쪽 가운데 상자 B4
    ?[{x:-150,locs:["TB2"]},...(Pp.tb4?[{x:-50,locs:["TB4"]}]:[]),{x:50,locs:["TB3"]},...(st.box.boxes.B4?[{x:150,locs:["B4"]}]:[])]
    :[{x:-150,locs:["B4"]},{x:-50,locs:[sg>0?"TB3":"TB2"]},...(Pp.tb4?[{x:50,locs:["TB4"]}]:[]),{x:150,locs:[sg>0?"TB2":"TB3"]}].sort((a,b)=>sg*a.x-sg*b.x);
  const START={TB5:[1,9,15],TB6:[1,7,11,17]};
  const devOf=pid=>pid.split("#")[0],idxIn=pid=>{const dv=M.devMap.get(devOf(pid));const b=dv&&boxOf.get(dv.tag);return b?b[1]:99};
  const ordLoc=L=>{const us=units.filter(u=>u.loc===L&&!u.tb);
    if(L==="TB1"||L==="TB2"||L==="TB3")return us.sort((a,b)=>a.rank-b.rank);
    const com=u=>new Set(u.pins.map(devOf)).size>1;
    return us.sort((a,b)=>(com(b)-com(a))||(Math.min(...a.pins.map(idxIn))-Math.min(...b.pins.map(idxIn)))||a.rank-b.rank)};
  const place=(tb,start,list)=>{let k=start;for(const u of list){while(k<=20&&slots[tb][k])k++;if(k>20)break;slots[tb][k]=u;u.tb=tb;u.n=k;k++}};
  topP.forEach((pp,i)=>{if(pp.locs[0]==="TB1"){for(const u of ordLoc("TB1")){const k=9+["L1","L2","L3","PE"].indexOf(u.pins[0].split("#")[1]);if(k>=9&&!slots.TB5[k]){slots.TB5[k]=u;u.tb="TB5";u.n=k}}return}
    place("TB5",START.TB5[i],pp.locs.slice().sort((a,b)=>sg*BX[a]-sg*BX[b]).flatMap(ordLoc))});
  botP.forEach((pp,i)=>place("TB6",START.TB6[i],pp.locs.flatMap(ordLoc)));
  // 남은 것(상자에 못 들어간 기구 등)은 빈 번호에
  for(const u of units.filter(u=>!u.tb).sort((a,b)=>a.rank-b.rank)){for(const tb of u.loc.startsWith("TB")?["TB6","TB5"]:["TB5","TB6"]){const i=free(tb);if(i){slots[tb][i]=u;u.tb=tb;u.n=i;break}}}
  const lost=units.filter(u=>!u.tb);if(lost.length)issues.push(`TB5·TB6 단자 40개가 모자라 ${lost.map(u=>u.label).join(", ")}을(를) 배정하지 못했습니다.`);
  for(const u of units)if(u.tb){const q=pts.get(u.tb+"#"+u.n);q.ext=u;q.info=u.locName+" "+u.label}
  // 이어 둔 선이 TB 번호가 아니라 '그 TB로 가는 바깥 기구 단자'를 따라가도록 쓰는 표
  const pinTB=new Map(),tbPins=new Map();for(const u of units)if(u.tb){const id=u.tb+"#"+u.n;tbPins.set(id,u.pins);u.pins.forEach(p=>pinTB.set(p,id))}
  // 묶음마다 이어야 할 제어판 점
  const ptNet=new Map(),bridges=[];
  for(const d of M.devs){const al=PN_TPL[d.type].alias;if(al)for(const[a,c]of Object.entries(al))if(pts.has(d.id+"#"+a)&&pts.has(d.id+"#"+c))bridges.push([d.id+"#"+c,d.id+"#"+a])}

    for(const[c,a]of bridges)if(n.pts.includes(c))n.alt.push(a)}
  const wn=nets.filter(n=>n.pts.length>=2);let ci=0;wn.forEach((n,i)=>{n.no=i+1;n.pts.forEach(p=>ptNet.set(p,n));n.alt.forEach(p=>ptNet.set(p,n));if(n.col==="C")n.hex=WR_PAL[ci++%WR_PAL.length]});
  return{M,st,geo,ch,pts,pinTB,tbPins,nets:wn,all:nets,units,outside,ptNet,bridges,issues:[...new Set(issues)],rNet:wn.find(n=>n.pts.includes("F#L1b")),tNet:wn.find(n=>n.pts.includes("F#L3b"))}}
function wrRefresh(){const key=JSON.stringify(circ.toJSON())+"|"+MAIN_ON+"|"+JSON.stringify(LY.saved)+JSON.stringify(LY.widths)+"|"+LY.jside+"|"+LY.grade+"|"+JSON.stringify(WR.assign)+"|"+JSON.stringify(pnPinMap());
  if(key!==WR.key||!WR.model){const old=WR.model,ser=WR.wires.map(([a,b])=>[wrSerEnd(a,old),wrSerEnd(b,old)]);
    WR.key=key;WR.model=wrBuild();const ok=new Set(WR.model.pts.keys());
    WR.wires=wrDesList(ser,WR.model).filter(([a,b])=>ok.has(a)&&ok.has(b));
    if(old&&WR.pend&&/^TB[56]#/.test(WR.pend))WR.pend=wrDesEnd(wrSerEnd(WR.pend,old),WR.model);
    if(WR.sel&&!WR.model.all.some(n=>n.id===WR.sel))WR.sel=null;if(WR.pend&&!ok.has(WR.pend))WR.pend=null}
  return WR.model}
const wrNet=id=>WR.model&&WR.model.all.find(n=>n.id===id);
const wrPN=id=>{const p=WR.model.pts.get(id);if(!p)return id;return p.kind==="tb"&&p.ext?`${p.name}(${p.ext.label})`:p.name};

// ── 이어진 상태 ──
function pnUF(){const par=new Map(),f=x=>{if(!par.has(x))par.set(x,x);while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x)}return x};return{f,u:(a,b)=>par.set(f(a),f(b))}}
function wrUF(){const uf=pnUF();for(const[a,b]of WR.model.bridges)uf.u(a,b);WR.wires.forEach(([a,b])=>uf.u(a,b));return uf}
function wrEval(){const Mo=WR.model,uf=wrUF(),cnt=new Map();WR.wires.forEach(([a,b])=>{cnt.set(a,(cnt.get(a)||0)+1);cnt.set(b,(cnt.get(b)||0)+1)});
  const wireOk=WR.wires.map(([a,b])=>{const na=Mo.ptNet.get(a),nb=Mo.ptNet.get(b);return!!(na&&na===nb)});
  let need=0,done=0;const st=new Map();
  for(const n of Mo.nets){const roots=new Map();n.pts.forEach(p=>{const r=uf.f(p);roots.set(r,(roots.get(r)||0)+1)});const comp=roots.size;need+=n.pts.length-1;done+=n.pts.length-comp;
    const big=[...roots].sort((a,b)=>b[1]-a[1])[0];st.set(n.id,{complete:comp===1,left:comp-1,big:big[1]>1?big[0]:null,uf})}
  const rootNets=new Map();for(const[p,n]of Mo.ptNet){const r=uf.f(p);if(!rootNets.has(r))rootNets.set(r,new Set());rootNets.get(r).add(n)}
  const shorts=[...rootNets.values()].filter(s=>s.size>1).map(s=>[...s]);
  const powerShort=!!(Mo.rNet&&Mo.tNet&&uf.f(Mo.rNet.pts[0])===uf.f(Mo.tNet.pts[0]));
  const over=[...cnt].filter(([,c])=>c>2).map(([p])=>p);
  return{uf,wireOk,bad:wireOk.filter(x=>!x).length,need,done,st,shorts,powerShort,over,cnt,complete:Mo.nets.filter(n=>st.get(n.id).complete).length}}
// 정답 결선: 묶음마다 가까운 점끼리 한 줄로 (한 단자 2가닥까지)
function wrAnswer(){const Mo=WR.model,steps=[];
  for(const n of Mo.nets){const Q=n.pts.map(id=>({id,p:Mo.pts.get(id)}));
    let cur=Q.find(q=>q.id.startsWith("TB"))||Q.find(q=>q.id.startsWith("F#"))||Q.slice().sort((a,b)=>a.p.y-b.p.y||a.p.x-b.p.x)[0];const left=Q.filter(q=>q!==cur),chain=[cur];
    while(left.length){let bi=0,bd=1e9;left.forEach((q,i)=>{const d=Math.hypot(q.p.x-cur.p.x,q.p.y-cur.p.y);if(d<bd){bd=d;bi=i}});cur=left.splice(bi,1)[0];chain.push(cur)}
    n.chain=chain.map(q=>q.id);for(let i=0;i+1<chain.length;i++)steps.push({net:n,a:chain[i].id,b:chain[i+1].id})}
  return steps}

  const w=lineX(circ.rows-1)+86,h=Math.max(bY(circ.cols)+40+(hasFLS()?FLS_EXTRA-30:0),MAIN_ON?MAIN_H:0),sc=2,savedHover=hover,sk=kcur;
  EXPORTING=true;hover=null;kcur=null;cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);ctx.setTransform(sc,0,0,sc,0,0);
  let url;try{draw();url=cv.toDataURL("image/png")}finally{EXPORTING=false;hover=savedHover;kcur=sk;resize();draw()}
  WR.imgKey=key;WR.img={url,w,h};return WR.img}
function wrDistSeg(x,y,[x1,y1,x2,y2]){const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy,t=L?Math.max(0,Math.min(1,((x-x1)*dx+(y-y1)*dy)/L)):0;return Math.hypot(x-x1-t*dx,y-y1-t*dy)}
function wrSeqHit(x,y){const Mo=WR.model,thr=Math.max(5,9/(WR.zsE||1));let best=null,bd=thr;
  for(const n of Mo.all){if(!n.sq)continue;for(const g of n.sq.segs){const d=wrDistSeg(x,y,g);if(d<bd){bd=d;best=n}}for(const p of n.sq.pts){const d=Math.hypot(x-p[0],y-p[1])-2;if(d<bd){bd=d;best=n}}}
  return best}

  if(wrHiOn()){const hv=WR.hov&&WR.hov!==WR.sel?wrNet(WR.hov):null;if(hv)s+=segs(hv,wrSeqHex(hv),5,.28);
    const n=wrNet(WR.sel);if(n){const c=wrSeqHex(n);s+=segs(n,c,4.5,.9);n.sq.pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="5.5" fill="#fff" stroke="${c}" stroke-width="2.4" class="wrpulse"/>`})}}
  return s}
function wrSeqRender(ev){const img=wrSeqImage(),box=$("wrSeqBox"),fit=Math.max(.3,Math.min(2,(box.clientWidth-18)/img.w))||.6;
  WR.zsE=WR.zs||fit;const st=$("wrSeqStage");st.style.width=img.w*WR.zsE+"px";st.style.height=img.h*WR.zsE+"px";
  const im=$("wrSeqImg");if(im.getAttribute("src")!==img.url)im.setAttribute("src",img.url);
  const sv=$("wrSeqSvg");sv.setAttribute("viewBox",`0 0 ${img.w} ${img.h}`);sv.innerHTML=wrSeqSVG(ev)}
function wrSeqScrollTo(n){if(!n||!n.sq||(!n.sq.segs.length&&!n.sq.pts.length))return;const xs=[],ys=[];n.sq.segs.forEach(g=>{xs.push(g[0],g[2]);ys.push(g[1],g[3])});n.sq.pts.forEach(p=>{xs.push(p[0]);ys.push(p[1])});
  const z=WR.zsE||1,box=$("wrSeqBox"),cx=(Math.min(...xs)+Math.max(...xs))/2*z+8,cy=(Math.min(...ys)+Math.max(...ys))/2*z+8,
    inView=Math.min(...xs)*z+8>=box.scrollLeft&&Math.max(...xs)*z+8<=box.scrollLeft+box.clientWidth&&Math.min(...ys)*z+8>=box.scrollTop&&Math.max(...ys)*z+8<=box.scrollTop+box.clientHeight;
  if(!inView)box.scrollTo({left:cx-box.clientWidth/2,top:cy-box.clientHeight/2,behavior:"smooth"})}

// ── 제어판 쪽 그림 (단위 mm) ──
const WR_VB=[-12,-6,424,432];
function wrLabF(g){const d=g.d,type=d.kind==="p12"?(d.sub==="eocr"?"eocr":"mc"):d.kind==="p8"?d.sub:null;if(!type)return null;const T=PN_TPL[type];
  return num=>{const s=Object.keys(T.slots).find(k=>T.slots[k]===num);return s?pnLabel(type,s):num}}
// ── 배선 경로 ──
// 단자에서 수직으로 나와 상하 기구 사이 통로를 타고 간다. 통로를 바꿔야 하면 제어판 양끝 수직 통로를 거친다.
// 같은 통로를 쓰는 선끼리 겹치지 않도록 통로 안에서 조금씩 비켜 놓는다(차선).
const WR_LANE=3.2,wrPts=p=>p.map(q=>q[0].toFixed(1)+","+q[1].toFixed(1)).join(" ");
function wrRoutes(list){const Mo=WR.model,C=Mo.ch,it=[],runs=[];
  list.forEach((w,i)=>{const a=Mo.pts.get(w[0]),b=Mo.pts.get(w[1]);if(!a||!b){it[i]=null;return}
    if(!WR.ortho||!C){it[i]={a,b,plain:true};return}
    const o={a,b,ca:a.ci,cb:b.ci,oa:0,ob:0,or:0};it[i]=o;
    if(o.ca!==o.cb){o.rail=(Math.abs(a.x-C.xL)+Math.abs(b.x-C.xL))<=(Math.abs(a.x-C.xR)+Math.abs(b.x-C.xR))?"L":"R";
      const rx=o.rail==="L"?C.xL:C.xR;
      runs.push({o,k:"h"+o.ca,f:"oa",lo:Math.min(a.x,rx),hi:Math.max(a.x,rx)});
      runs.push({o,k:"h"+o.cb,f:"ob",lo:Math.min(b.x,rx),hi:Math.max(b.x,rx)});
      runs.push({o,k:"v"+o.rail,f:"or",lo:Math.min(C.c[o.ca],C.c[o.cb]),hi:Math.max(C.c[o.ca],C.c[o.cb])})}
    else if(Math.abs(a.x-b.x)>.01)runs.push({o,k:"h"+o.ca,f:"oa",lo:Math.min(a.x,b.x),hi:Math.max(a.x,b.x)})});
  const gp=new Map();runs.forEach(r=>{if(!gp.has(r.k))gp.set(r.k,[]);gp.get(r.k).push(r)});
  for(const[k,arr]of gp){arr.sort((p,q)=>p.lo-q.lo||p.hi-q.hi);const m=arr.length,
    av=k[0]==="h"?C.a[+k[1]]:(k[1]==="L"?C.aL:C.aR),sp=m>1?Math.min(WR_LANE,2*av/(m-1)):0;
    arr.forEach((r,j)=>{r.o[r.f]=(j-(m-1)/2)*sp})}
  return it.map(o=>{if(!o)return null;const{a,b}=o;if(o.plain)return[[a.x,a.y],[b.x,b.y]];
    const ya=C.c[o.ca]+o.oa,yb=C.c[o.cb]+o.ob;
    if(o.rail){const rx=(o.rail==="L"?C.xL:C.xR)+o.or;return[[a.x,a.y],[a.x,ya],[rx,ya],[rx,yb],[b.x,yb],[b.x,b.y]]}
    if(Math.abs(a.x-b.x)<.01)return[[a.x,a.y],[b.x,b.y]];
    return[[a.x,a.y],[a.x,ya],[b.x,ya],[b.x,b.y]]})}
function wrWire(path,col,o={}){const hx=o.hex;const P=wrPts(path),L=(c,w,x={})=>`<polyline points="${P}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${x.dash?` stroke-dasharray="${x.dash}"`:""}${x.op?` opacity="${x.op}"`:""}/>`;
  let s="";if(o.sel)s+=L(WR_HI,3.2,{op:.55});else if(!o.print)s+=L("#fff",2.3);
  if(o.bad)return s+L(WR_BAD,1.3)+L("#fff",.5,{dash:"2 2"});
  if(col==="PE")return s+L(WR_COL.PE,1.25)+L("#ffd43b",1.25,{dash:"2.6 2.6"});
  if(col==="C"&&hx&&hx!==WR_COL.C)return s+L(hx,1.3);
  if(col==="C")return s+L("#9a7b00",1.5)+L(WR_COL.C,1);
  return s+L(WR_COL[col],1.25)}
function wrPanelSVG(ev,opt={}){const Mo=WR.model,X=x=>x,Y=y=>y;let s=`<rect x="${WR_VB[0]}" y="${WR_VB[1]}" width="${WR_VB[2]}" height="${WR_VB[3]}" fill="#fff"/>`;
  s+=lyR(0,0,400,420,1.6);
  for(const[y,n]of[[50,"TB5"],[370,"TB6"]]){s+=lyTermBlock(X,Y,1,y,n==="TB5");s+=lyT(200-LY_TB.bw-4,y+2.4,n,6.5,{a:"end"})}
  for(const g of Mo.geo.values())s+=lyDevBox(g.d,X,Y,1,g.x,g.y,g.w,g.h,wrLabF(g));
  // TB 바깥쪽 행선 표시 (세로 글씨)
  for(const[id,q]of Mo.pts)if(q.kind==="tb"&&q.ext){const t=q.ext.label.length>12?q.ext.label.slice(0,11)+"…":q.ext.label,y=q.tb==="TB5"?34:386,col=(h=>h===WR_COL.C?"#7a6200":h)(wrHex(q.ext.net));
    s+=`<text x="${q.x+1.5}" y="${y}" transform="rotate(-90 ${q.x+1.5} ${y})" text-anchor="${q.tb==="TB5"?"start":"end"}" font-family="${LYF}" font-size="4.3" font-weight="700" fill="${opt.print?"#000":col}"><title>${escH(q.info)}</title>${escH(t)}</text>`}
  // 정답 결선
  if(opt.ans){const rp=wrRoutes(opt.ans.map(t=>[t.a,t.b]));
    opt.ans.forEach((stp,i)=>{const pa=rp[i];if(!pa)return;
      if(opt.print)s+=wrWire(pa,stp.net.col,{print:true,hex:wrHex(stp.net)});
      else s+=`<polyline points="${wrPts(pa)}" fill="none" stroke="${(h=>h===WR_COL.C?"#c9a000":h)(wrHex(stp.net))}" stroke-width="1" stroke-dasharray="3 2" opacity=".85" pointer-events="none"/>`})}
  // 내 배선
  if(!opt.noUser){const rp=wrRoutes(WR.wires);
    WR.wires.forEach(([a0,b0],i)=>{const pa=rp[i];if(!pa)return;const n=Mo.ptNet.get(a0)||Mo.ptNet.get(b0);
      s+=`<g data-w="${i}" style="cursor:pointer"><polyline points="${wrPts(pa)}" fill="none" stroke="transparent" stroke-width="4.5"/>`+
        wrWire(pa,n?n.col:"C",{sel:WR.wsel===i,bad:WR.check&&!ev.wireOk[i],print:opt.print,hex:n?wrHex(n):null})+`</g>`})}
  if(opt.print)return s;
  // 표시: 고른 묶음의 점 · 채점 결과 · 3가닥
  const n=wrHiOn()?wrNet(WR.sel):null,ring=(q,c,w,cls="",r=4.3,f="none")=>`<circle cx="${q.x}" cy="${q.y}" r="${r}" fill="${f}" stroke="${c}" stroke-width="${w}" class="${cls}" pointer-events="none"/>`;
  if(n&&n.pts){const t=ev.st.get(n.id);for(const p of[...n.pts,...n.alt]){const q=Mo.pts.get(p),joined=t&&t.big&&t.uf.f(p)===t.big;s+=joined?ring(q,WR_OK,1.2,"",4.3,"rgba(47,158,68,.18)"):ring(q,WR_HI,1.3,"wrpulse",4.6,"rgba(10,132,255,.14)")}}
  if(WR.check)for(const m of Mo.nets){const t=ev.st.get(m.id);if(t.complete)continue;for(const p of m.pts)if(!t.big||t.uf.f(p)!==t.big)s+=ring(Mo.pts.get(p),WR_WARN,1.2)}
  for(const p of ev.over)s+=ring(Mo.pts.get(p),WR_BAD,1.4,"",5.2);
  if(WR.pend){const q=Mo.pts.get(WR.pend);if(q)s+=ring(q,"#ff7a00",1.8,"",4.8)+`<line id="wrRub" x1="${q.x}" y1="${q.y}" x2="${q.x}" y2="${q.y}" stroke="#ff7a00" stroke-width=".9" stroke-dasharray="2.5 2" pointer-events="none"/>`}
  // 누르는 자리 (맨 위)
  for(const[id,q]of Mo.pts){const nn=Mo.ptNet.get(id);s+=`<circle class="wrpt" data-pt="${escH(id)}" cx="${q.x}" cy="${q.y}" r="5" fill="transparent"><title>${escH(wrPN(id)+(q.info&&q.kind==="dev"?" · "+q.info:"")+(nn?` · 묶음 ${nn.no}`:" · 이 회로에서는 쓰지 않음"))}</title></circle>`}
  return s}

function wrAddWire(a,b){const Mo=WR.model;if(a===b)return false;
  if(WR.wires.some(([x,y])=>x===a&&y===b||x===b&&y===a)){wrHint("이미 이어진 선입니다.",true);return false}
  const na=Mo.ptNet.get(a),nb=Mo.ptNet.get(b),cnt=id=>WR.wires.filter(w=>w.includes(id)).length;
  if(WR.mode==="guide"){
    if(!na||na!==nb){wrHint(`${wrPN(a)}와(과) ${wrPN(b)}는 같은 묶음이 아니라 이을 수 없습니다. 파랗게 깜박이는 단자끼리 이어 주세요.`,true);return false}
    if(wrUF().f(a)===wrUF().f(b)){wrHint("두 단자는 이미 다른 선을 거쳐 이어져 있습니다.",true);return false}
    if(cnt(a)>=2||cnt(b)>=2){wrHint(`${wrPN(cnt(a)>=2?a:b)} 단자에는 이미 2가닥이 물려 있습니다. 한 단자에 3가닥은 걸 수 없으니 같은 묶음의 다른 단자에서 이어 주세요.`,true);return false}}
  wrSnap();WR.wires.push([a,b]);WR.wsel=null;wrSave();WR.sel=(na||nb||{}).id||WR.sel;
  const ev=wrEval(),n=na&&na===nb?na:null;
  if(cnt(a)>2||cnt(b)>2)wrHint(`${wrPN(cnt(a)>2?a:b)} 단자에 3가닥이 물렸습니다. 실기에서는 한 단자에 2가닥까지만 겁니다.`,true);
  else if(n&&ev.st.get(n.id).complete&&WR.mode==="guide"){const left=WR.model.nets.filter(m=>!ev.st.get(m.id).complete).length;wrHint(`묶음 ${n.no} 완료 ✔ ${left?`남은 묶음 ${left}곳 — '다음 묶음'을 누르거나 시퀀스도에서 다음 점을 누르세요.`:"모든 묶음을 이었습니다!"}`)}
  else wrHint(`${wrPN(a)} ↔ ${wrPN(b)} 을(를) 이었습니다.`);
  return true}
function wrSelect(id,from){WR.sel=id;const n=wrNet(id);if(WR.pend&&(!n||WR.model.ptNet.get(WR.pend)!==n))WR.pend=null;
  if(n&&from!=="seq")wrSeqScrollTo(n);
  if(n&&n.pts&&n.pts.length>=2)wrHint(`묶음 ${n.no} · ${n.where} — 파랗게 깜박이는 단자 ${n.pts.length}곳을 이어 주세요.`);else if(n)wrHint("제어판 밖(컨트롤 박스·현장)에서 잇는 선입니다.");}
function wrNext(){const Mo=wrRefresh(),ev=wrEval(),L=Mo.nets,i=L.findIndex(n=>n.id===WR.sel);
  for(let k=1;k<=L.length;k++){const n=L[(i+k+L.length)%L.length];if(!ev.st.get(n.id).complete){WR.pend=null;wrSelect(n.id);wrRender();return}}
  wrHint("모든 묶음을 이었습니다.")}
function wrDrawNet(){const n=wrNet(WR.sel);if(!n)return;const ans=wrAnswer().filter(s=>s.net===n);let k=0;
  const uf=wrUF();wrSnap();const keep=WR.undo.pop();let added=false;
  for(const s of ans)if(uf.f(s.a)!==uf.f(s.b)){if(!added){WR.undo.push(keep);added=true}WR.wires.push([s.a,s.b]);uf.u(s.a,s.b);k++}
  wrSave();wrRender();wrHint(k?`묶음 ${n.no}에 전선 ${k}가닥을 그렸습니다.`:"이미 다 이어져 있습니다.")}

<script>

// 시퀀스도의 기구로 「배관 및 기구 배치도」·「제어판 내부 기구 배치도」·「범례」를 그림 (전기기능사 공개문제 1·2·9·10번 형식)
// 제어판 내부: 400×420, 세로 기준선 TB5 50 · 1줄 145 · 2줄 275 · TB6 370 (치수 50·95·130·95·50)

const LY_GRADE={func:{name:"전기기능사",kind:"전기기능사",task:"전기 설비의 배선 및 배관 공사"},ind:{name:"전기공사산업기사",kind:"전기공사산업기사",task:"(2과제) 전기 설비의 배선 및 배관 공사"}};
const LY={grade:"func",jside:"right",title:{kind:"전기기능사",task:"전기 설비의 배선 및 배관 공사"},widths:{mccb:55,p12:72,p8:42,f:22},saved:{},undo:[],zoom:1,drag:null,cur:null};
const LY_W0={mccb:55,p12:72,p8:42,f:22};const LY_WV=3;   // 기구 폭 기본값 판(2: 10% 키움, 3: 12P 폭 15% 키움 — 2026-11-12)
function lyLoad(){const s=pnStore.get("seqsim.layout");if(!s)return;
  if(s.title)Object.assign(LY.title,s.title);
  // 예전 판에 저장된 폭은 10% 키워서 이어 씀
  if(s.widths)for(const k in LY_W0){let v=+s.widths[k];if(!(v>=10&&v<=150))continue;if((s.wv||1)<2)v=v*1.1;if((s.wv||1)<3&&k==="p12")v=v*1.15;v=Math.round(v);LY.widths[k]=Math.min(150,v)}
  LY.grade=s.grade==="ind"?"ind":"func";LY.jside=s.jside==="left"?"left":"right";LY.saved=s.saved&&typeof s.saved==="object"?s.saved:{}}
function lySave(){const keys=Object.keys(LY.saved);if(keys.length>40)delete LY.saved[keys[0]];pnStore.set("seqsim.layout",{wv:LY_WV,grade:LY.grade,title:LY.title,widths:LY.widths,jside:LY.jside,saved:LY.saved})}
const lyNat=(a,b)=>a.localeCompare(b,undefined,{numeric:true});

// ── 시퀀스도에서 기구 뽑기 ──
function lyParts(C){const cells=[...C.cells.values()],all=[...cells,...C.bus.values(),...C.hparts.values()];
  const tags=ks=>[...new Set(all.filter(v=>ks.includes(v.k)).map(v=>v.tag).filter(Boolean))].sort(lyNat);
  const coils=[...new Set(cells.filter(v=>v.k==="COIL").map(v=>v.tag))];
  const eocr=coils.includes("EOCR")||tags(["THR_A","THR_B"]).length>0;
  const mc=coils.filter(t=>/^MC/i.test(t)).sort(lyNat);
  const relay=coils.filter(t=>t!=="EOCR"&&!/^MC/i.test(t)).sort(lyNat);
  const p8=[...relay.map(t=>({id:"p8:"+t,tag:t,kind:"p8",sub:"relay"})),...tags(["FR"]).map(t=>({id:"p8:"+t,tag:t,kind:"p8",sub:"fr"})),
    ...tags(["TIMER"]).map(t=>({id:"p8:"+t,tag:t,kind:"p8",sub:"timer"})),...tags(["FLS"]).map(t=>({id:"p8:"+t,tag:t,kind:"p8",sub:"fls"})),
    ...tags(["CNT"]).map(t=>({id:"p8:"+t,tag:t,kind:"p8",sub:"cnt"}))];
  const inner=[{id:"MCCB",tag:"MCCB",kind:"mccb"},...(eocr?[{id:"EOCR",tag:"EOCR",kind:"p12",sub:"eocr"}]:[]),{id:"F",tag:"F",kind:"f"},
    ...mc.map(t=>({id:"mc:"+t,tag:t,kind:"p12",sub:"mc"})),...p8];
  const pb=tags(["PB_A","PB_B"]),ss=tags(["SW_A","SW_B"]),lamp=tags(["LAMP"]),bz=tags(["BZ"]),ls=tags(["LS_A","LS_B"]),fls=tags(["FLS"]);
  return{inner,p8,mc,eocr,pb,ss,lamp,bz,ls,fls,tb4:fls.length?"fls":ls.length?"ls":null}}
const lyInd=()=>LY.grade==="ind";
const lySig=P=>(lyInd()?"ind|":"")+P.inner.map(d=>d.id).join(",")+"|"+[...P.pb,...P.ss,...P.lamp,...P.bz].join(",");

// ── 제어판 내부 자동 배치: 1줄 MCCB·EOCR·F + 8P, 2줄 남은 8P + MC ──
function lyAutoInner(P){const by=id=>P.inner.find(d=>d.id===id),p8=P.p8.map(d=>d.id),r1=["MCCB",...(P.eocr?["EOCR"]:[]),"F"];
  if(lyInd()){   // 산업기사: 1줄 MCCB·EOCR·F + 타이머·플리커·카운터·FLS, 2줄 릴레이 + MC (한 줄 5개, 2줄이 넘치면 릴레이를 1줄로)
    const other=P.p8.filter(d=>d.sub!=="relay").map(d=>d.id),rel=P.p8.filter(d=>d.sub==="relay").map(d=>d.id),mc=P.mc.map(t=>"mc:"+t);
    while(r1.length<5&&other.length)r1.push(other.shift());
    const r2=[...other,...rel,...mc];while(r1.length<5&&r2.length>5&&rel.length){const t=rel.shift();r2.splice(r2.indexOf(t),1);r1.push(t)}
    return{r1,r2}}
  while(r1.length<5&&p8.length)r1.push(p8.shift());
  return{r1,r2:[...p8,...P.mc.map(t=>"mc:"+t)]}}
// ── 컨트롤 박스 자동 채움: PB는 짝지어, SS는 한 박스(남는 구멍 CAP), 램프·부저는 짝지어 / 4박스에 안 들어가면 3구 박스 ──
// 박스 자리: B1(J 없는 쪽 위) · B4(아래) · B2(J 바로 아래) · B3(J 끝)
// 산업기사: 상자 4개(B1 J 없는 쪽 위·B2 J 아래·B3 J 끝·B4 오른쪽 가운데), 3구·2구를 섞어 씀
//  조작 기구: SS 하나씩(2구, 남는 구멍 CAP) → PB 셋씩(3구) 순으로 B1→B2→B4→B3
//  표시 기구(램프 이름순 → 부저): 3개 이하면 상자 하나, 넘으면 첫 상자 3개·나머지 상자에 2개까지 나눠 남은 상자를 B2→B4→B3→B1 순으로 채움
//  (산업기사 공개문제 두 도면: PB0·PB1·PB2 / GL·RL1·RL2 / YL+CAP / WL+CAP, SS+CAP / PB0·PB1·PB2 / RL1·RL2·WL / YL·BZ 와 같게 나옴)
function lyAutoBoxesInd(P){const chunk=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
  const boxes={B1:null,B2:null,B3:null,B4:null},over=[],pad=g=>[...g,...Array((g.length>=3?3:2)-g.length).fill("CAP")];
  for(const g of[...P.ss.map(t=>[t]),...chunk(P.pb,3)]){const k=["B1","B2","B4","B3"].find(o=>!boxes[o]);if(!k){over.push(...g);continue}boxes[k]=pad(g)}
  const ind=[...P.lamp,...P.bz],rem=["B2","B4","B3","B1"].filter(o=>!boxes[o]),r=rem.length,groups=[];
  if(ind.length&&!r)over.push(...ind);
  else if(ind.length<=3){if(ind.length)groups.push(ind)}
  else{const first=Math.max(1,Math.min(3,ind.length-(r-1)));
    groups.push(ind.slice(0,first));let rest=ind.slice(first);const m=r-1;
    for(let i=0;i<m&&rest.length;i++){const take=Math.min(2,Math.ceil(rest.length/(m-i)));groups.push(rest.slice(0,take));rest=rest.slice(take)}
    over.push(...rest)}
  groups.forEach((g,i)=>{if(rem[i])boxes[rem[i]]=pad(g);else over.push(...g)});
  return{cap:"mix",boxes,over}}
function lyAutoBoxes(P){if(lyInd())return lyAutoBoxesInd(P);const chunk=(a,n)=>{const r=[];for(let i=0;i<a.length;i+=n)r.push(a.slice(i,i+n));return r};
  for(const cap of[2,3]){const ops=[...chunk(P.pb,cap),...P.ss.map(t=>[t])],ind=chunk([...P.lamp,...P.bz],cap);
    if(ops.length+ind.length<=4||cap===3){const boxes={B1:null,B2:null,B3:null,B4:null},over=[];
      const put=(list,order)=>{for(const it of list){const k=order.find(o=>!boxes[o]);if(!k){over.push(...it);continue}
        boxes[k]=[...it,...Array(cap-it.length).fill("CAP")]}};
      put(ops,["B1","B4","B2","B3"]);put(ind,["B3","B2","B4","B1"]);
      return{cap,boxes,over}}}}
// 저장해 둔 사용자 배치와 합치기(기구가 바뀌면 빠진 것은 빼고 새것은 자동 자리에)
function lyState(){const P=lyParts(circ),sig=lySig(P),auto=lyAutoInner(P),ab=lyAutoBoxes(P),sv=LY.saved[sig];

function lyLegendSVG(st,x0,y0,w){const{left,right}=lyLegend(st),n=Math.max(left.length,right.length),rh=17,cw=[w*.17,w*.33,w*.17,w*.33];let s="";

  const xs=[x0,x0+cw[0],x0+cw[0]+cw[1],x0+cw[0]+cw[1]+cw[2],x0+w];
  s+=lyR(x0,y0,w,rh*(n+1),1.1);
  for(let i=0;i<=n;i++)s+=lyL([[x0,y0+rh*i],[x0+w,y0+rh*i]],0.7);
  for(let j=1;j<4;j++)s+=lyL([[xs[j],y0],[xs[j],y0+rh*(n+1)]],j===2?1:0.7);
  ["기   호","명   칭","기   호","명   칭"].forEach((t,j)=>{s+=lyT((xs[j]+xs[j+1])/2,y0+12,t,8,{w:500})});
  for(let i=0;i<n;i++){const yy=y0+rh*(i+1)+12,a=left[i],b=right[i];
    if(a)s+=lyT((xs[0]+xs[1])/2,yy,a[0],7.6,{w:500})+lyT((xs[1]+xs[2])/2,yy,a[1],7.6,{w:500});
    if(b)s+=lyT((xs[2]+xs[3])/2,yy,b[0],7.6,{w:500})+lyT((xs[3]+xs[4])/2,yy,b[1],7.6,{w:500})}
  return{svg:s,h:rh*(n+1)}}

// ── 페이지 (A4 595×842) ──
function lyHeader(){const t=LY.title,x=40,w=515,y=36,h=34,c=[0,72,175,229,470,495,515];let s="";
  s+=lyR(x,y,w,h,1.2);for(let i=1;i<c.length-1;i++)s+=lyL([[x+c[i],y],[x+c[i],y+h]],1);
  const mid=(i)=>x+(c[i]+c[i+1])/2;
  s+=lyT(mid(0),y+21,"자격종목",10.5,{w:600})+lyT(mid(1),y+21,t.kind,11,{w:600})+lyT(mid(2),y+21,"과제명",10.5,{w:600});
  const task=String(t.task||"");let cut=-1;if(task.length>12){const m=task.indexOf("의 ");if(m>0&&m<task.length-3)cut=m+1;else{let best=-1;for(let i=0;i<task.length;i++)if(task[i]===" "&&(best<0||Math.abs(i-task.length/2)<Math.abs(best-task.length/2)))best=i;cut=best}}
  if(cut>0)s+=lyT(mid(3),y+14.5,task.slice(0,cut),10.5,{w:600})+lyT(mid(3),y+28,task.slice(cut+1),10.5,{w:600});else s+=lyT(mid(3),y+21,task,10.5,{w:600});
  s+=lyT(mid(4),y+21,"척도",10,{w:600})+lyT(mid(5),y+21,"NS",10,{w:600});return s}
function lyPage1(st){let s=`<rect width="595" height="842" fill="#fff"/>`+lyHeader()+lyT(48,96,"1) 배관 및 기구 배치도",10,{a:"start",w:500});
  const sg=LY.jside==="left"?-1:1;s+=lyPipeSVG(st,sg>0?305:350,370,0.30);s+=lyT(48,680,"※ NOTE: 치수 기준점은 제어함의 중심으로 한다.",9,{a:"start",w:500});return s}
function lyPage2(st,interactive){let s=`<rect width="595" height="842" fill="#fff"/>`+lyHeader()+lyT(48,96,"2) 제어판 내부 기구 배치도",10,{a:"start",w:500});
  s+=lyInnerSVG(st,175,160,0.68,interactive);const lg=lyLegendSVG(st,58,500,480);s+=lg.svg;return s}

// ── 경고 ──
function lyWarnings(st){const w=[],P=st.P,by=id=>P.inner.find(d=>d.id===id);
  for(const[name,ids]of[["1줄",st.inner.r1],["2줄",st.inner.r2]]){const ds=ids.map(by).filter(Boolean);if(ds.length>5)w.push(`${name}에 기구가 ${ds.length}개입니다. 시험지 배치는 한 줄에 5개까지입니다.`);
    const{gap}=lyRowX(ds);if(ds.length>1&&gap<5)w.push(`${name} 기구 사이 간격이 ${Math.round(gap)} mm로 너무 좁습니다. 기구를 다른 줄로 옮기거나 기구 폭을 줄여 주세요.`)}
  if(st.box.over.length)w.push(`컨트롤 박스 4개에 다 들어가지 않는 기구가 있습니다: ${st.box.over.join(", ")}`);
  if(!P.eocr)w.push("시퀀스도에 EOCR이 없어 제어판 배치에서 뺐습니다.");
  if(!P.mc.length)w.push("시퀀스도에 전자접촉기(MC)가 없습니다.");
  if(!P.tb4)w.push("시퀀스도에 리밋 스위치나 플로트레스가 없어 TB4와 그 배관을 뺐습니다.");
  return w}

// ── 화면 ──
function lyRender(){if(PN.view!=="layout")return;const st=lyState();LY.cur=st;
  const z=LY.zoom,wpx=Math.round(595*z*1.25);
  $("lyPages").innerHTML=`<div class="lypage"><svg id="lyP1" viewBox="0 0 595 842" width="${wpx}" xmlns="http://www.w3.org/2000/svg">${lyPage1(st)}</svg></div>`+
    `<div class="lypage"><svg id="lyP2" viewBox="0 0 595 842" width="${wpx}" xmlns="http://www.w3.org/2000/svg">${lyPage2(st,true)}</svg></div>`;
  const P=st.P,warn=lyWarnings(st);
  $("lyInfo").innerHTML=`<div class="pvstat"><span>제어판 안 기구</span><b>${P.inner.length}개</b><span>컨트롤 박스</span><b>${Object.values(st.box.boxes).filter(Boolean).length}개 · ${st.box.cap==="mix"?[...new Set(Object.values(st.box.boxes).filter(Boolean).map(b=>b.length+"구"))].sort().reverse().join("·"):st.box.cap+"구"}</b>`+
    `<span>조작 기구 (PB·SS)</span><b>${P.pb.length+P.ss.length}개</b><span>표시 기구 (램프·부저)</span><b>${P.lamp.length+P.bz.length}개</b></div>`+
    (typeof WR!=="undefined"&&Object.keys(WR.assign).length?`<div class="card"><div class="big">제어반 결선의 손 배정 ${Object.keys(WR.assign).length}개</div>제어반 결선 탭 '단자대 배정'에서 직접 정한 단자대 번호는 배치를 바꿔도 그대로입니다. 나머지 번호와 이어 둔 배선은 배치대로 따라 바뀝니다.</div>`:"")+
    (warn.length?`<div class="card bad"><div class="warn">확인</div><ul>${warn.map(x=>`<li>${escH(x)}</li>`).join("")}</ul></div>`:"")+
    `<div class="card"><div class="big">바꾸는 법</div><ul><li>2쪽 제어판 기구를 끌어 순서를 바꾸거나 다른 줄로 옮깁니다. 줄마다 양 끝 50 mm, 사이는 같은 간격으로 다시 맞춰집니다.</li><li>1쪽 컨트롤 박스의 구멍(PB·램프·CAP)을 끌어 다른 구멍에 놓으면 서로 바뀝니다.</li><li>${st.custom?"지금은 직접 바꾼 배치입니다. ":""}'자동 배치로'를 누르면 처음 규칙대로 돌아갑니다.</li></ul></div>`;
  document.querySelectorAll('input[name="lyJ"]').forEach(r=>r.checked=r.value===LY.jside);document.querySelectorAll('input[name="lyG"]').forEach(r=>r.checked=r.value===LY.grade)}
function lySvgPt(svg,e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
// 끌기: 제어판 기구(2쪽) · 박스 구멍(1쪽)
$("lyPages").addEventListener("pointerdown",e=>{if(e.button!==0)return;const dev=e.target.closest(".lydev"),hole=e.target.closest(".lyhole");if(!dev&&!hole)return;e.preventDefault();
  const svg=e.target.closest("svg"),st=LY.cur,g={x0:e.clientX,y0:e.clientY,on:false,el:null};
  const label=dev?(st.P.inner.find(d=>d.id===dev.dataset.id)||{}).tag:(()=>{const[b,i]=hole.dataset.slot.split(":");return st.box.boxes[b][+i]})();
  const mv=ev=>{if(!g.on){if(Math.hypot(ev.clientX-g.x0,ev.clientY-g.y0)<5)return;g.on=true;LY.drag=dev?{id:dev.dataset.id}:{slot:hole.dataset.slot};lyRender();
      g.el=document.createElement("div");g.el.className="ghost";g.el.textContent=label+" 옮기기";document.body.appendChild(g.el)}
    g.el.style.left=ev.clientX+"px";g.el.style.top=ev.clientY+"px"};
  const up=ev=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",up);
    if(g.el)g.el.remove();const drag=LY.drag;LY.drag=null;if(!g.on||ev.type==="pointercancel"){lyRender();return}
    const s2=$(dev?"lyP2":"lyP1"),pt=lySvgPt(s2,ev);
    if(dev){const G=LY.geo,mx=(pt.x-G.ox)/G.k,my=(pt.y-G.oy)/G.k;if(mx<-60||mx>460||my<20||my>400){lyRender();return}
      const row=my<210?"r1":"r2",R={r1:st.inner.r1.filter(i=>i!==drag.id),r2:st.inner.r2.filter(i=>i!==drag.id)};
      const cx=id=>{const it=G.items.find(q=>q.id===id);return it?it.x+it.w/2:0};let idx=R[row].findIndex(id=>cx(id)>mx);if(idx<0)idx=R[row].length;R[row].splice(idx,0,drag.id);
      lySnap();st.inner=R;lyRemember(st);lyRender();lyHint(`${label}을(를) ${row==="r1"?"1":"2"}줄로 옮겼습니다. 간격을 다시 맞췄습니다.`)}
    else{const tgt=LY.pgeo.items.find(q=>Math.hypot(q.x-pt.x,q.y-pt.y)<=q.r+6);if(!tgt||tgt.slot===drag.slot){lyRender();return}
      const[b1,i1]=drag.slot.split(":"),[b2,i2]=tgt.slot.split(":"),B=st.box.boxes;const t=B[b1][+i1];B[b1][+i1]=B[b2][+i2];B[b2][+i2]=t;
      lySnap();lyRemember(st);lyRender();lyHint(`${t}와(과) ${B[b1][+i1]} 자리를 바꿨습니다.`)}};
  window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up)});
function lyHint(t,w){const h=$("lyHint");h.textContent=t||"";h.classList.toggle("warn",!!w)}
window.addEventListener("keydown",e=>{if(PN.view!=="layout"||$("modalRoot").firstChild)return;const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();if(!LY.undo.length){lyHint("되돌릴 것이 없습니다.");return}LY.saved=JSON.parse(LY.undo.pop());lySave();lyRender()}});

// ── 왼쪽 설정 ──
function lySide(){const W=LY.widths,ind=lyInd();
  $("lySide").innerHTML=`<h3>도면 종류</h3>
    <label class="lyr"><input type="radio" name="lyG" value="func"> 전기기능사</label><label class="lyr"><input type="radio" name="lyG" value="ind"> 전기공사산업기사</label>
    <h3>J박스 위치</h3>
    <label class="lyr"><input type="radio" name="lyJ" value="right"> 오른쪽형${ind?"":" (2·10번)"}</label><label class="lyr"><input type="radio" name="lyJ" value="left"> 왼쪽형${ind?"":" (1·9번)"}</label>
    <div class="pvbar"><button class="btn" id="lyAuto">자동 배치로</button><button class="btn" id="lyUndo">되돌리기</button></div>
    <h3>제목줄</h3>
    <label class="lyt">자격종목<input id="lyKind" value="${escH(LY.title.kind)}" maxlength="20"></label><label class="lyt">과제명<input id="lyTask" value="${escH(LY.title.task)}" maxlength="40"></label>
    <h3>저장</h3>
    <div class="pvbar"><button class="btn primary" id="lyPdf" style="min-width:0">PDF (2쪽)</button><button class="btn" id="lyJ1">JPG 1쪽</button><button class="btn" id="lyJ2">JPG 2쪽</button></div>
    <div class="pvbar"><button class="btn" id="lyZo" aria-label="축소">－</button><button class="btn" id="lyZi" aria-label="확대">＋</button></div>
    <details class="lywd"${LY.wopen?" open":""}><summary>기구 폭 (mm)</summary>
    <div class="lyw"><label>MCCB<input type="number" data-w="mccb" value="${W.mccb}" min="10" max="150"></label><label>EOCR·MC (12P)<input type="number" data-w="p12" value="${W.p12}" min="10" max="150"></label>
      <label>8P 소켓<input type="number" data-w="p8" value="${W.p8}" min="10" max="150"></label><label>퓨즈홀더 F<input type="number" data-w="f" value="${W.f}" min="10" max="150"></label></div></details>`;
  document.querySelectorAll('input[name="lyG"]').forEach(r=>{r.checked=r.value===LY.grade;r.onchange=()=>lySetGrade(r.value)});
  document.querySelectorAll('input[name="lyJ"]').forEach(r=>{r.checked=r.value===LY.jside;r.onchange=()=>{LY.jside=r.value;lySave();lyRender()}});
  $("lySide").querySelector(".lywd").ontoggle=e=>{LY.wopen=e.target.open};
  $("lyAuto").onclick=()=>{const st=LY.cur||lyState();if(!LY.saved[st.sig]){lyHint("이미 자동 배치입니다.");return}lySnap();delete LY.saved[st.sig];lySave();lyRender();lyHint("자동 배치로 되돌렸습니다.")};
  $("lyUndo").onclick=()=>{if(!LY.undo.length){lyHint("되돌릴 것이 없습니다.");return}LY.saved=JSON.parse(LY.undo.pop());lySave();lyRender()};
  document.querySelectorAll("[data-w]").forEach(i=>i.onchange=()=>{const v=Math.round(+i.value);if(!(v>=10&&v<=150)){i.value=LY.widths[i.dataset.w];lyHint("기구 폭은 10~150 mm로 적어 주세요.",true);return}LY.widths[i.dataset.w]=v;lySave();lyRender()});
  $("lyKind").oninput=e=>{LY.title.kind=e.target.value;lySave();lyRender()};$("lyTask").oninput=e=>{LY.title.task=e.target.value;lySave();lyRender()};
  $("lyZi").onclick=()=>{LY.zoom=Math.min(2,+(LY.zoom+.15).toFixed(2));lyRender()};$("lyZo").onclick=()=>{LY.zoom=Math.max(.5,+(LY.zoom-.15).toFixed(2));lyRender()};
  $("lyPdf").onclick=()=>lyExport("pdf");$("lyJ1").onclick=()=>lyExport(1);$("lyJ2").onclick=()=>lyExport(2)}
// 도면 종류 바꾸기: 제목줄이 그 종류의 기본값이면 새 종류의 기본값으로 바꿈(직접 고친 제목은 그대로). 배치는 종류별로 따로 기억.
function lySetGrade(g){g=g==="ind"?"ind":"func";if(g===LY.grade)return;const old=LY_GRADE[LY.grade],nw=LY_GRADE[g];
  if(!LY.title.kind||LY.title.kind===old.kind)LY.title.kind=nw.kind;if(!LY.title.task||LY.title.task===old.task)LY.title.task=nw.task;
  LY.grade=g;lySave();lySide();lyRender();lyHint(`${nw.name} 도면으로 바꿨습니다.`+(g==="ind"?" 3구·2구 상자, 오른쪽 가운데 상자, ④ 금속관(TB2)이 들어갑니다.":""))}
// ── 저장: SVG → 그림 → JPG / PDF ──
async function lyCanvas(n){const st=lyState(),body=n===1?lyPage1(st):lyPage2(st,false),sc=3.5;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${595*sc}" height="${842*sc}" viewBox="0 0 595 842">${body}</svg>`;
  const img=new Image(),url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));
  await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url});
  const c=document.createElement("canvas");c.width=595*sc;c.height=842*sc;const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0);URL.revokeObjectURL(url);return c}
async function lyExport(what){const base=((name&&!/^(새 도면|불러온 도면|t)$/.test(name)?name.replace(/^[①-⑳]\s*/,"")+" ":"")+"배치도").replace(/[\\/:*?"<>|]+/g,"_").slice(0,60);
  lyHint("파일을 만드는 중입니다…");
  try{let blob,file;
    if(what==="pdf"){let jsPDF;try{jsPDF=await loadJsPdf()}catch(e){throw{code:"pdf_load"}}
      const doc=new jsPDF({orientation:"portrait",unit:"pt",format:"a4"});
      for(const n of[1,2]){const c=await lyCanvas(n);if(n>1)doc.addPage("a4","portrait");doc.addImage(c.toDataURL("image/jpeg",0.95),"JPEG",0,0,595.28,841.89)}
      doc.setProperties({title:base});blob=doc.output("blob");file=base+".pdf"}
    else{const c=await lyCanvas(what);blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.95));file=`${base} ${what}쪽.jpg`}
    lyHint("저장 확인 창이 뜨면 '저장'을 눌러 주세요.");await saveFile(file,blob);lyHint(`'${file}' 파일을 저장했습니다.`)}
  catch(e){const code=e&&e.code;lyHint(code==="declined"?"저장을 취소했습니다.":code==="pdf_load"?"PDF 도구를 불러오지 못했습니다. 인터넷 연결을 확인하거나 JPG로 저장해 주세요.":"저장하지 못했습니다. 다시 시도해 주세요.",code!=="declined")}}

$("vLay").onclick=()=>setView("layout");
lyLoad();lySide();
try{const v=localStorage.getItem("seqsim.view");if(v==="layout"||v==="panel")setView(v)}catch(e){}
</script>
